[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "arches-rascolls"
readme = "README.md"
authors = [
    {name = "Arches Project"}
]
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
]
requires-python = ">=3.12"
dependencies = [
    "arches>=8.2.0a25,<9.0.0",
    "django_csp==3.8",
    "psycopg[pool]>=3.3.6",
    "arches_modular_reports>=2.1.0a5",
    "arches_search>=0.1.0a23",
    "arches_resource_sets>=0.1.0a4",
    "arches_abac_permissions>=0.1.0a0",
]
version = "0.0.2a0"

[dependency-groups]
dev = [
    "livereload",
    "sst",
    "coverage",
    "django-silk==5.5.0",
    "pre-commit==4.6.1",
    "black==26.3.1",
]

[tool.setuptools.packages.find]
include = ["arches_rascolls*"]
